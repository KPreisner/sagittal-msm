version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  uv-sync:
    desc: Install/update the virtual environment from uv.lock
    cmds:
      - uv sync

  py-lint:
    desc: Lint, check formatting, and type check (same as CI)
    cmds:
      - uv run ruff check
      - uv run ruff format --check
      - uv run mypy

  py-format:
    desc: Auto-format and apply safe lint fixes (incl. import sorting)
    cmds:
      - uv run ruff check --fix
      - uv run ruff format

  py-test:
    desc: Run unit tests
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  bench:
    desc: Quick benchmarks (small n) into benchmarks/results-quick/
    cmds:
      - uv run python benchmarks/batch_size.py --log-n 10 --max-batch 10 --out benchmarks/results-quick
      - uv run python benchmarks/compare.py --max-measured-log-n 12 --out benchmarks/results-quick
      - uv run python benchmarks/memory.py --out benchmarks/results-quick
      - uv run python benchmarks/structure.py --out benchmarks/results-quick

  bench-full:
    desc: Full benchmarks into benchmarks/results/ (about 30 s)
    cmds:
      - uv run python benchmarks/batch_size.py
      - uv run python benchmarks/compare.py
      - uv run python benchmarks/memory.py
      - uv run python benchmarks/structure.py
