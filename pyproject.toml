[project]
name = "sagittal-msm"
version = "0.1.0"
description = "Sagittal MSM: a bit-sliced multi-scalar multiplication algorithm for ZK provers, with exact operation counts."
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Karl Preisner" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.17", "mypy>=2.4", "pytest>=9.0"]
bench = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "bench"]

[tool.ruff]
line-length = 100
extend-exclude = ["old", "tmp"]
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, N naming, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benchmarks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
